<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>linus</title>

  <link href="./styles/output.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>

<body class="min-h-screen">
  <main class="flex min-h-screen justify-center items-center px-6">
    <div class="flex items-center gap-6">
      <img
        src="./assets/profile.png"
        alt="profile image"
        class="h-24 w-24 rounded-full object-contain"
      />

      <div class="flex flex-col">
        <h1 class="text-3xl font-bold">
          <span id="social-name" class="inline-block">linus kang</span>
        </h1>

        <p class="text-lg italic text-muted">
          something web dev something something
        </p>

        <div class="mt-3 flex items-center gap-3">
          <a
            href="mailto:m@linus.id.au"
            target="_blank"
            data-name="m [at] linuskang [dot] au"
            rel="noopener noreferrer"
            class="social"
          >
            <img
              src="./assets/email.svg"
              alt="Email"
              class="h-10 w-10"
            />
          </a>

          <a
            href="https://git.linus.my"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linuskang"
          >
            <img
              src="./assets/gitea.svg"
              alt="Gitea"
              class="h-10 w-10"
            />
          </a>

          <a
            href="https://github.com/linuskang"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linuskang"
          >
            <img
              src="./assets/github.svg"
              alt="GitHub"
              class="h-8 w-8"
            />
          </a>

          <a
            href="https://codeberg.org/linuskang"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linuskang"
          >
            <img
              src="./assets/codeberg.svg"
              alt="Codeberg"
              class="h-8 w-8"
            />
          </a>

          <a
            href="https://twitch.tv/linuskang"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linuskang"
          >
            <img
              src="./assets/twitch.svg"
              alt="Twitch"
              class="h-8 w-8"
            />
          </a>

          <a
            href="https://gitlab.com/linuskang"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linuskang"
          >
            <img
              src="./assets/gitlab.svg"
              alt="GitLab"
              class="h-8 w-8"
            />
          </a>

          <a
            href="https://youtube.com/@linus-kang"
            target="_blank"
            rel="noopener noreferrer"
            class="social"
            data-name="@linus-kang"
          >
            <img
              src="./assets/youtube.svg"
              alt="YouTube"
              class="h-10 w-10"
            />
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="fixed bottom-5 flex justify-center items-center w-full gap-3">
    <p class="text-muted">
      It's currently <span id="time" class="link">00:00</span> in my timezone
    </p>
    <a
      href="https://github.com/linuskang/linuskang.au/blob/master/LICENSE"
      class="link"
      target="_blank"
      rel="noopener noreferrer"
    >
      License
    </a>

    <a
      href="/guestbook"
      class="link"
    >
      Guestbook
    </a>
  </footer>

  <div class="fixed bottom-5 right-5">
    <img
      src="./assets/not-by-ai.svg"
      alt="Not by AI"
      class="w-24"
    />
  </div>
</body>

<script src="./scripts/oneko.js"></script>
<script src="./scripts/social.js"></script>
<script src="./scripts/time.js"></script>

<script defer src="https://analytics.linus.my/script.js" data-website-id="f1243d8f-0528-411e-9e05-b2a53ff18a30"></script>

</html>
