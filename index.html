<!doctype html>

        <div class="mt-3 flex items-center gap-3">
          <a
            href="mailto:m@linus.id.au"
            target="_blank"
            data-name="m [at] linuskang [dot] au"
            rel="noopener noreferrer"

          >

              src="./assets/email.svg"
              alt="Email"

            />
          </a>

          <a
            href="https://git.linus.my"
            target="_blank"

          <a

              class="h-10 w-10"
